<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Work Sans', 'sans-serif'],
            },
            colors: {
              gold: {
                400: '#fbbf24',
                500: '#f59e0b',
                600: '#d97706',
              },
              dark: {
                800: '#1f2937',
                900: '#111827',
                950: '#030712',
              }
            },
            screens: {
                'xs': '375px',
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #09111f;
        background-image:
          linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0 1px, transparent 1px 100%),
          linear-gradient(115deg, rgba(251, 191, 36, 0.10), transparent 34%),
          linear-gradient(245deg, rgba(34, 211, 238, 0.10), transparent 38%),
          linear-gradient(180deg, #111827 0%, #0f172a 46%, #030712 100%);
        background-size: 72px 72px, 100% 100%, 100% 100%, 100% 100%;
        background-attachment: fixed;
        color: #f3f4f6;
        -webkit-tap-highlight-color: transparent;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        overflow-x: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -2;
        pointer-events: none;
        background:
          linear-gradient(120deg, transparent 0 20%, rgba(255,255,255,0.045) 20% 20.3%, transparent 20.3% 100%),
          linear-gradient(62deg, transparent 0 58%, rgba(251,191,36,0.065) 58% 58.25%, transparent 58.25% 100%),
          linear-gradient(155deg, transparent 0 70%, rgba(125,211,252,0.05) 70% 70.25%, transparent 70.25% 100%);
        opacity: 0.9;
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background: linear-gradient(180deg, rgba(3,7,18,0.18), rgba(3,7,18,0.72));
      }

      * {
        scrollbar-color: rgba(251, 191, 36, 0.45) rgba(255,255,255,0.08);
      }

      button,
      input,
      select,
      textarea {
        transition: transform 180ms ease, border-color 180ms ease, background-color 180ms ease, box-shadow 180ms ease, color 180ms ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      button:active {
        transform: translateY(0) scale(0.98);
      }

      input,
      select,
      textarea {
        background-color: rgba(15, 23, 42, 0.54) !important;
        border-color: rgba(255, 255, 255, 0.13) !important;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
        backdrop-filter: blur(18px) saturate(1.25);
        -webkit-backdrop-filter: blur(18px) saturate(1.25);
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: rgba(251, 191, 36, 0.65) !important;
        box-shadow: 0 0 0 1px rgba(251,191,36,0.28), 0 0 24px rgba(251,191,36,0.10), inset 0 1px 0 rgba(255,255,255,0.08) !important;
      }

      .bg-gray-800,
      .bg-gray-800\/50,
      .bg-gray-800\/80,
      .bg-gray-900,
      .bg-gray-900\/30,
      .bg-gray-900\/50,
      .bg-gray-900\/80,
      .bg-gray-900\/90,
      .bg-gray-950 {
        background:
          linear-gradient(145deg, rgba(255,255,255,0.105), rgba(255,255,255,0.035) 42%, rgba(15,23,42,0.62)) !important;
        backdrop-filter: blur(22px) saturate(1.35);
        -webkit-backdrop-filter: blur(22px) saturate(1.35);
        box-shadow:
          0 18px 55px rgba(0, 0, 0, 0.34),
          inset 0 1px 0 rgba(255,255,255,0.12),
          inset 0 -1px 0 rgba(255,255,255,0.035);
      }

      .border-gray-600,
      .border-gray-700,
      .border-gray-800,
      .border-gray-700\/50 {
        border-color: rgba(255,255,255,0.12) !important;
      }

      .bg-gold-500,
      .bg-gold-600,
      .hover\:bg-gold-600:hover {
        background:
          linear-gradient(145deg, rgba(255,255,255,0.42), rgba(251,191,36,0.95) 32%, rgba(217,119,6,0.95)) !important;
        box-shadow:
          0 14px 35px rgba(245,158,11,0.25),
          inset 0 1px 0 rgba(255,255,255,0.48);
      }

      .bg-white,
      .hover\:bg-gray-100:hover {
        background:
          linear-gradient(145deg, rgba(255,255,255,0.96), rgba(226,232,240,0.84)) !important;
        box-shadow:
          0 16px 40px rgba(255,255,255,0.14),
          inset 0 1px 0 rgba(255,255,255,0.9);
      }

      .rounded-2xl,
      .rounded-3xl,
      .rounded-xl {
        position: relative;
      }

      .shadow-xl,
      .shadow-2xl,
      .shadow-lg {
        box-shadow:
          0 20px 60px rgba(0, 0, 0, 0.35),
          inset 0 1px 0 rgba(255,255,255,0.08) !important;
      }
      
      @keyframes slideIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      
      .animate-slide-in {
        animation: slideIn 0.46s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .glass-card {
        background:
          linear-gradient(145deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04) 48%, rgba(15,23,42,0.62));
        border: 1px solid rgba(255,255,255,0.13);
        box-shadow:
          0 20px 60px rgba(0,0,0,0.34),
          inset 0 1px 0 rgba(255,255,255,0.14);
        backdrop-filter: blur(22px) saturate(1.35);
        -webkit-backdrop-filter: blur(22px) saturate(1.35);
      }

      .glass-card:hover {
        border-color: rgba(251,191,36,0.28);
        box-shadow:
          0 24px 70px rgba(0,0,0,0.40),
          0 0 40px rgba(251,191,36,0.055),
          inset 0 1px 0 rgba(255,255,255,0.18);
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.08); 
      }
      ::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, rgba(251,191,36,0.70), rgba(148,163,184,0.44)); 
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(251,191,36,0.78); 
      }

      /* Splash Screen Styles */
      #splash-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background-color: #09111f;
        background-image:
          linear-gradient(135deg, rgba(255,255,255,0.08) 0 1px, transparent 1px 100%),
          linear-gradient(115deg, rgba(251,191,36,0.12), transparent 34%),
          linear-gradient(180deg, #111827 0%, #030712 100%);
        background-size: 72px 72px, 100% 100%, 100% 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 0.5s ease-out, visibility 0.5s;
      }
      
      .splash-icon {
        width: 90px;
        height: 90px;
        margin-bottom: 24px;
        animation: pulse-gold 2s infinite;
      }
      
      .splash-title {
        font-family: 'Work Sans', sans-serif;
        font-size: 28px;
        font-weight: 700;
        color: white;
        margin-bottom: 8px;
        letter-spacing: -0.5px;
        text-align: center;
        line-height: 1.1;
      }

      .splash-loader {
        width: 120px;
        height: 4px;
        background: rgba(255,255,255,0.1);
        border-radius: 2px;
        overflow: hidden;
        margin-top: 24px;
      }

      .splash-loader-bar {
        height: 100%;
        width: 50%;
        background: #f59e0b;
        border-radius: 2px;
        animation: loading 1.5s infinite ease-in-out;
      }

      @keyframes pulse-gold {
        0% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(245, 158, 11, 0)); }
        50% { transform: scale(1.05); filter: drop-shadow(0 0 20px rgba(245, 158, 11, 0.3)); }
        100% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(245, 158, 11, 0)); }
      }

      @keyframes loading {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(200%); }
      }

      .splash-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "jspdf-autotable": "https://aistudiocdn.com/jspdf-autotable@^5.0.2",
    "jspdf": "https://aistudiocdn.com/jspdf@^3.0.4"
  }
}
</script>
</head>
  <body>
    <!-- Splash Screen HTML -->
    <div id="splash-screen">
      <!-- Logo Hexagonal Gestão Máxima -->
      <svg class="splash-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
        <polyline points="7.5 12 10 14.5 16.5 8"></polyline>
      </svg>
      <div class="splash-title">Gestão<br/>Máxima</div>
      <div class="text-gray-500 text-xs font-sans uppercase tracking-widest">Sistema Profissional</div>
      <div class="splash-loader">
        <div class="splash-loader-bar"></div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
