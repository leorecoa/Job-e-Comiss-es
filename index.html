
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#f4efe4" />
    <meta name="description" content="Job e Comissoes: sistema operacional para agenda, servicos e comissoes de barbearias." />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Job e Comissoes" />

    <meta property="og:title" content="Job e Comissoes" />
    <meta property="og:description" content="Sistema profissional para clientes, vendas e comissoes." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/brand-mark.svg" />

    <title>Job e Comissoes | Agenda e operacao para barbearias</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/brand-mark.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        background: #f4efe4;
        color: #25231f;
        -webkit-tap-highlight-color: transparent;
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }

      * {
        scrollbar-color: #958a78 #ece4d5;
      }

      button,
      input,
      select,
      textarea {
        transition: transform 180ms ease, border-color 180ms ease, background-color 180ms ease, box-shadow 180ms ease, color 180ms ease;
      }


      @keyframes slideIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .animate-slide-in {
        animation: slideIn 0.46s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }

      ::-webkit-scrollbar-track {
        background: #ece4d5;
      }

      ::-webkit-scrollbar-thumb {
        background: #958a78;
        border-radius: 3px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #70695e;
      }

      #splash-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background-color: #f4efe4;
        background-image: linear-gradient(90deg, rgba(154,113,50,0.06) 1px, transparent 1px);
        background-size: 48px 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 0.22s ease-out, visibility 0.22s;
      }

      #splash-screen::before,
      #splash-screen::after {
        content: "";
        position: absolute;
        pointer-events: none;
      }

      #splash-screen::before {
        width: min(56vw, 340px);
        height: min(56vw, 340px);
        border: 1px solid #cfc4b2;
        border-radius: 34%;
        transform: rotate(16deg);
        background: radial-gradient(circle, rgba(154,113,50,0.08), transparent 58%);
      }

      #splash-screen::after {
        inset: 0;
        background: radial-gradient(circle at 50% 42%, rgba(154,113,50,0.07), transparent 30%);
      }

      .splash-brand-shell {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 22px;
        border: 1px solid #958a78;
        border-radius: 22px;
        background: #fffdf7;
        box-shadow: 0 12px 32px rgba(52,45,34,0.09);
        animation: splash-rise 0.32s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      .splash-icon {
        width: 68px;
        height: 68px;
        margin-bottom: 14px;
        filter: drop-shadow(0 10px 18px rgba(245,158,11,0.18));
      }

      .splash-title {
        font-family: 'Fraunces', serif;
        font-size: 22px;
        font-weight: 700;
        color: #25231f;
        margin-bottom: 6px;
        text-align: center;
        line-height: 1.1;
      }

      .splash-loader {
        width: 96px;
        height: 3px;
        background: #ece4d5;
        border-radius: 2px;
        overflow: hidden;
        margin-top: 14px;
      }

      .splash-loader-bar {
        height: 100%;
        width: 44%;
        background: #9a7132;
        border-radius: 2px;
        animation: loading 1.5s infinite ease-in-out;
      }

      .splash-kicker {
        color: #9a7132;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      @keyframes splash-rise {
        from { opacity: 0; transform: translateY(8px) scale(0.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes loading {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(200%); }
      }

      .splash-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
    </style>
  </head>

  <body>
    <div id="splash-screen">
      <div class="splash-brand-shell">
        <img class="splash-icon" src="/brand-mark.svg" alt="Job e Comissoes" />
        <div class="splash-title">Job e<br />Comissoes</div>
        <div class="splash-kicker">Sistema operacional</div>
        <div class="splash-loader">
          <div class="splash-loader-bar"></div>
        </div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
