
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#09111f" />
    <meta name="description" content="Job e Comissoes: sistema operacional para agenda, servicos e comissoes de barbearias." />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Job e Comissoes" />

    <meta property="og:title" content="Job e Comissoes" />
    <meta property="og:description" content="Sistema profissional para clientes, vendas e comissoes." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/brand-mark.svg" />

    <title>Job e Comissoes | Agenda e operacao para barbearias</title>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/brand-mark.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Work+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        background-color: #09111f;
        background-image:
          linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0 1px, transparent 1px 100%),
          linear-gradient(115deg, rgba(251, 191, 36, 0.10), transparent 34%),
          linear-gradient(245deg, rgba(34, 211, 238, 0.10), transparent 38%),
          linear-gradient(180deg, #111827 0%, #0f172a 46%, #030712 100%);
        background-size: 72px 72px, 100% 100%, 100% 100%, 100% 100%;
        background-attachment: fixed;
        color: #f3f4f6;
        -webkit-tap-highlight-color: transparent;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        overflow-x: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -2;
        pointer-events: none;
        background:
          linear-gradient(120deg, transparent 0 20%, rgba(255,255,255,0.045) 20% 20.3%, transparent 20.3% 100%),
          linear-gradient(62deg, transparent 0 58%, rgba(251,191,36,0.065) 58% 58.25%, transparent 58.25% 100%),
          linear-gradient(155deg, transparent 0 70%, rgba(125,211,252,0.05) 70% 70.25%, transparent 70.25% 100%);
        opacity: 0.9;
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background: linear-gradient(180deg, rgba(3,7,18,0.18), rgba(3,7,18,0.72));
      }

      * {
        scrollbar-color: rgba(251, 191, 36, 0.45) rgba(255,255,255,0.08);
      }

      button,
      input,
      select,
      textarea {
        transition: transform 180ms ease, border-color 180ms ease, background-color 180ms ease, box-shadow 180ms ease, color 180ms ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      button:active {
        transform: translateY(0) scale(0.98);
      }

      input,
      select,
      textarea {
        background-color: rgba(15, 23, 42, 0.54) !important;
        border-color: rgba(255, 255, 255, 0.13) !important;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
        backdrop-filter: blur(18px) saturate(1.25);
        -webkit-backdrop-filter: blur(18px) saturate(1.25);
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: rgba(251, 191, 36, 0.65) !important;
        box-shadow: 0 0 0 1px rgba(251,191,36,0.28), 0 0 24px rgba(251,191,36,0.10), inset 0 1px 0 rgba(255,255,255,0.08) !important;
      }

      .bg-gray-800,
      .bg-gray-800\/50,
      .bg-gray-800\/80,
      .bg-gray-900,
      .bg-gray-900\/30,
      .bg-gray-900\/50,
      .bg-gray-900\/80,
      .bg-gray-900\/90,
      .bg-gray-950 {
        background:
          linear-gradient(145deg, rgba(255,255,255,0.105), rgba(255,255,255,0.035) 42%, rgba(15,23,42,0.62)) !important;
        backdrop-filter: blur(22px) saturate(1.35);
        -webkit-backdrop-filter: blur(22px) saturate(1.35);
        box-shadow:
          0 18px 55px rgba(0, 0, 0, 0.34),
          inset 0 1px 0 rgba(255,255,255,0.12),
          inset 0 -1px 0 rgba(255,255,255,0.035);
      }

      .border-gray-600,
      .border-gray-700,
      .border-gray-800,
      .border-gray-700\/50 {
        border-color: rgba(255,255,255,0.12) !important;
      }

      .bg-gold-500,
      .bg-gold-600,
      .hover\:bg-gold-600:hover {
        background:
          linear-gradient(145deg, rgba(255,255,255,0.42), rgba(251,191,36,0.95) 32%, rgba(217,119,6,0.95)) !important;
        box-shadow:
          0 14px 35px rgba(245,158,11,0.25),
          inset 0 1px 0 rgba(255,255,255,0.48);
      }

      .bg-white,
      .hover\:bg-gray-100:hover {
        background:
          linear-gradient(145deg, rgba(255,255,255,0.96), rgba(226,232,240,0.84)) !important;
        box-shadow:
          0 16px 40px rgba(255,255,255,0.14),
          inset 0 1px 0 rgba(255,255,255,0.9);
      }

      .rounded-2xl,
      .rounded-3xl,
      .rounded-xl {
        position: relative;
      }

      .shadow-xl,
      .shadow-2xl,
      .shadow-lg {
        box-shadow:
          0 20px 60px rgba(0, 0, 0, 0.35),
          inset 0 1px 0 rgba(255,255,255,0.08) !important;
      }

      @keyframes slideIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .animate-slide-in {
        animation: slideIn 0.46s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .glass-card {
        background:
          linear-gradient(145deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04) 48%, rgba(15,23,42,0.62));
        border: 1px solid rgba(255,255,255,0.13);
        box-shadow:
          0 20px 60px rgba(0,0,0,0.34),
          inset 0 1px 0 rgba(255,255,255,0.14);
        backdrop-filter: blur(22px) saturate(1.35);
        -webkit-backdrop-filter: blur(22px) saturate(1.35);
      }

      .glass-card:hover {
        border-color: rgba(251,191,36,0.28);
        box-shadow:
          0 24px 70px rgba(0,0,0,0.40),
          0 0 40px rgba(251,191,36,0.055),
          inset 0 1px 0 rgba(255,255,255,0.18);
      }

      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }

      ::-webkit-scrollbar-track {
        background: rgba(255,255,255,0.08);
      }

      ::-webkit-scrollbar-thumb {
        background: linear-gradient(180deg, rgba(251,191,36,0.70), rgba(148,163,184,0.44));
        border-radius: 3px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: rgba(251,191,36,0.78);
      }

      #splash-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background-color: #09111f;
        background-image:
          linear-gradient(135deg, rgba(255,255,255,0.08) 0 1px, transparent 1px 100%),
          linear-gradient(115deg, rgba(251,191,36,0.12), transparent 34%),
          linear-gradient(180deg, #111827 0%, #030712 100%);
        background-size: 72px 72px, 100% 100%, 100% 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 0.5s ease-out, visibility 0.5s;
      }

      #splash-screen::before,
      #splash-screen::after {
        content: "";
        position: absolute;
        pointer-events: none;
      }

      #splash-screen::before {
        width: min(70vw, 520px);
        height: min(70vw, 520px);
        border: 1px solid rgba(251,191,36,0.14);
        border-radius: 38%;
        transform: rotate(16deg);
        background: radial-gradient(circle, rgba(251,191,36,0.12), transparent 58%);
        filter: blur(1px);
        animation: splash-orbit 7s ease-in-out infinite;
      }

      #splash-screen::after {
        inset: 0;
        background:
          linear-gradient(118deg, transparent 0 37%, rgba(255,255,255,0.10) 37% 37.25%, transparent 37.25% 100%),
          radial-gradient(circle at 50% 42%, rgba(251,191,36,0.12), transparent 34%);
      }

      .splash-brand-shell {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 34px;
        border: 1px solid rgba(255,255,255,0.13);
        border-radius: 30px;
        background: linear-gradient(145deg, rgba(255,255,255,0.12), rgba(255,255,255,0.035) 52%, rgba(15,23,42,0.58));
        box-shadow:
          0 28px 90px rgba(0,0,0,0.45),
          0 0 64px rgba(245,158,11,0.12),
          inset 0 1px 0 rgba(255,255,255,0.16);
        backdrop-filter: blur(24px) saturate(1.35);
        -webkit-backdrop-filter: blur(24px) saturate(1.35);
        animation: splash-rise 0.72s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      .splash-icon {
        width: 104px;
        height: 104px;
        margin-bottom: 24px;
        animation: pulse-gold 2s infinite;
        filter: drop-shadow(0 18px 28px rgba(245,158,11,0.24));
      }

      .splash-title {
        font-family: 'Work Sans', sans-serif;
        font-size: 28px;
        font-weight: 700;
        color: white;
        margin-bottom: 8px;
        letter-spacing: -0.5px;
        text-align: center;
        line-height: 1.1;
      }

      .splash-loader {
        width: 150px;
        height: 4px;
        background: rgba(255,255,255,0.12);
        border-radius: 2px;
        overflow: hidden;
        margin-top: 24px;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.12);
      }

      .splash-loader-bar {
        height: 100%;
        width: 44%;
        background: linear-gradient(90deg, #fff7ed, #f59e0b, #38bdf8);
        border-radius: 2px;
        animation: loading 1.5s infinite ease-in-out;
      }

      .splash-kicker {
        color: rgba(251,191,36,0.88);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      @keyframes pulse-gold {
        0% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(245, 158, 11, 0)); }
        50% { transform: scale(1.05); filter: drop-shadow(0 0 20px rgba(245, 158, 11, 0.3)); }
        100% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(245, 158, 11, 0)); }
      }

      @keyframes splash-rise {
        from { opacity: 0; transform: translateY(14px) scale(0.96); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes splash-orbit {
        0%, 100% { transform: rotate(16deg) scale(1); opacity: 0.75; }
        50% { transform: rotate(28deg) scale(1.04); opacity: 1; }
      }

      @keyframes loading {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(200%); }
      }

      .splash-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
    </style>
  </head>

  <body>
    <div id="splash-screen">
      <div class="splash-brand-shell">
        <img class="splash-icon" src="/brand-mark.svg" alt="Job e Comissoes" />
        <div class="splash-title">Job e<br />Comissoes</div>
        <div class="splash-kicker">Sistema operacional</div>
        <div class="splash-loader">
          <div class="splash-loader-bar"></div>
        </div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
